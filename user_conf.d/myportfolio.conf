# Create a rate-limit key only for POST /api/timeline_post.
#
# POST /api/timeline_post -> client IP address
# Every other request     -> empty string, so it is not rate limited
map "$request_method:$uri" $timeline_post_limit_key {
    default                      "";
    "POST:/api/timeline_post"    $binary_remote_addr;
}

# Store rate-limit information in a 10 MB shared-memory zone.
# Allow one matching request per minute for each IP address.
limit_req_zone $timeline_post_limit_key
               zone=timeline_post_limit:10m
               rate=1r/m;

server {
    listen 80;
    server_name aarzoobansal.duckdns.org;

    if ($host = aarzoobansal.duckdns.org) {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name aarzoobansal.duckdns.org;

    location / {
        # This directive sees every request, but only POST
        # /api/timeline_post has a non-empty rate-limit key.
        limit_req zone=timeline_post_limit;

        # Return HTTP 429 instead of Nginx's default HTTP 503.
        limit_req_status 429;

        proxy_pass http://myportfolio:5000;
    }

    # Load the certificate files
    ssl_certificate /etc/letsencrypt/live/aarzoobansal.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aarzoobansal.duckdns.org/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/aarzoobansal.duckdns.org/chain.pem;
}