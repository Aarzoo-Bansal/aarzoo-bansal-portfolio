name: Deploy

on:
  push:
    branches:
      - main
  
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    env:
      TESTING: true
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
 
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
 
      - name: Setup Python Virtual Environment
        run: python -m venv python3-virtualenv
 
      - name: Install Dependencies
        run: python3-virtualenv/bin/pip install -r requirements.txt
 
      - name: Run Tests
        run: ./run_test.sh
  
  deploy:
    name: "Deploy to VPS"
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh/
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy-key.pem
          chmod 600 ~/.ssh/deploy-key.pem
          cat >> ~/.ssh/config <<END
          Host my-vps
            HostName $SSH_IP
            User $SSH_USER
            IdentityFile ~/.ssh/deploy-key.pem
            StrictHostKeyChecking no
          END
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_IP: ${{ secrets.SSH_IP }}
        
      - name: Deploy site
        run: ssh my-vps '~/redeploy-site.sh'
      
      - name: Print container status
        run: ssh my-vps "cd '$PROJECT_ROOT' && docker compose ps"
        env:
          PROJECT_ROOT: ${{ secrets.PROJECT_ROOT }}
      
      - name: Notify Discord on success
        run: curl -s -X POST "$DISCORD_WEBHOOK" -d "content=🚀 Deployment Successful"
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

  notify-failure:
    name: Notify failure
    needs: [test, deploy]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord on failure
        run: curl -s -X POST "$DISCORD_WEBHOOK" -d "content=🚨 Deployment Failed"
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
